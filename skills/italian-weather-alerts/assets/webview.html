<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Italian Weather Alerts</title>
<style>
:root { color-scheme: light dark; --bg:#f5f5f7; --card:#fff; --text:#151515; --muted:#666; --line:#ddd; }
@media (prefers-color-scheme:dark) { :root { --bg:#151515; --card:#252525; --text:#f5f5f7; --muted:#bbb; --line:#444; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
main { max-width:680px; margin:auto; }
h1 { margin:0 0 4px; font-size:28px; }
h2 { margin:0; font-size:21px; }
p { margin:7px 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 2px 8px #00000012; }
.header { display:flex; justify-content:space-between; gap:12px; align-items:start; }
.badge { border-radius:10px; padding:7px 10px; font-weight:700; font-size:12px; white-space:nowrap; }
.live { background:#d8f5df; color:#176b2b; }.demo { background:#ffe6b8; color:#7a4700; }.stale { background:#ffd9d9; color:#8b1111; }
.alert { border-left:7px solid #999; padding:13px; border-radius:12px; margin-top:10px; background:#00000008; }
.alert.yellow { border-color:#f0c400; }.alert.orange { border-color:#f28c00; }.alert.red { border-color:#d71920; }
.level { font-weight:800; }.yellow .level { color:#9b7b00; }.orange .level { color:#c66e00; }.red .level { color:#c1121f; }
.meta { color:var(--muted); font-size:12px; line-height:1.45; }
.map { height:170px; border-radius:14px; background:linear-gradient(145deg,#e6e7eb,#cfd2d8); display:flex; align-items:center; justify-content:center; color:#555; font-weight:700; letter-spacing:.3px; }
.warn { background:#fff2cc; color:#694d00; border:1px solid #e3bd4d; border-radius:12px; padding:10px; }
@media (prefers-color-scheme:dark) { .warn { background:#4b3b12; color:#ffe8a3; border-color:#856d24; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const params = new URLSearchParams(location.search);
  let payload = {};
  try { payload = JSON.parse(params.get("payload") || "{}"); } catch (_) { payload = {}; }
  const app = document.getElementById("app");
  const alerts = Array.isArray(payload.alerts) ? payload.alerts : [];
  const status = payload.status || "unknown";
  const quality = payload.dataQuality || {};
  const maxLevel = alerts.reduce((current, item) => rank(item.level) > rank(current) ? item.level : current, "none");
  const statusText = status === "demo" ? "DEMO DATA — NOT LIVE" : status.toUpperCase();
  const source = (payload.sourceUrls || [])[0] || "";
  const warning = status === "demo" ? "This dashboard uses fictional development data. Do not use it for emergency decisions." : (quality.warnings || []).join(" ");
  app.innerHTML = `
    <section class="card">
      <div class="header"><div><h1>🇮🇹 Italian Weather Alerts</h1><h2>${escapeHtml(payload.location || "Italy")}</h2></div><span class="badge ${status === "live" ? "live" : "demo"}">${escapeHtml(statusText)}</span></div>
      <p><strong>${escapeHtml(labelLevel(maxLevel))}</strong> · ${escapeHtml(payload.date || "today")}</p>
      ${warning ? `<div class="warn">⚠️ ${escapeHtml(warning)}</div>` : ""}
    </section>
    <section class="card"><h2>Risk details</h2>${alerts.length ? alerts.map(renderAlert).join("") : `<p>No matching alert record was found in the dataset.</p>`}</section>
    <section class="card"><h2>Italy overview</h2><div class="map">🗺️ National alert map — planned data layer</div><p class="meta">The production version will display official alert zones and selectable details for all Italian regions and autonomous provinces.</p></section>
    <section class="card"><h2>Source and freshness</h2><p class="meta">Bulletin: ${escapeHtml(payload.bulletin?.issuedAt || "not available")}<br>Generated: ${escapeHtml(payload.generatedAt || "not available")}<br>Source: ${source ? `<a href="${escapeAttr(source)}">official source ↗</a>` : "not configured"}</p></section>`;

  function renderAlert(item) {
    const level = normalize(item.level || "none");
    return `<article class="alert ${escapeAttr(level)}"><div class="level">${escapeHtml(item.risk || "Risk")} — ${escapeHtml(labelLevel(item.level))}</div><div>${escapeHtml(item.description || "No description available.")}</div><div class="meta">Zone: ${escapeHtml(item.zone || "not available")} · Valid: ${escapeHtml(item.validFrom || "-")} to ${escapeHtml(item.validTo || "-")}</div></article>`;
  }
  function rank(level) { return ({ none:0, yellow:1, orange:2, red:3 })[normalize(level)] ?? 0; }
  function normalize(value) { return String(value || "").toLowerCase(); }
  function labelLevel(level) { return ({ none:"NO ALERT", yellow:"YELLOW ALERT", orange:"ORANGE ALERT", red:"RED ALERT" })[normalize(level)] || "STATUS UNKNOWN"; }
  function escapeHtml(value) { return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
  function escapeAttr(value) { return escapeHtml(value).replace(/javascript:/gi, ""); }
</script>
</body>
</html>
